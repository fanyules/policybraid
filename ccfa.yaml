claims:
  - id: "C-P"
    text: >-
      At a fixed checkpoint, heterogeneous rollout runtimes realize
      prompt-dependent behavior-policy differences that alter the canonical
      learner gradient beyond matched execution and resampling noise.
    status: "testing"
  - id: "C0"
    text: >-
      A completion-driven scheduler over heterogeneous rollout engines changes
      the behavior-policy mixture consumed by a group-based learner.
    status: "reopened_not_tested"
  - id: "C1"
    text: >-
      A held-out policy-risk budget reduces mixture-induced gradient deviation
      while retaining at least 1.30x effective rollout throughput over
      A100-only.
    status: "reopened_not_tested"
